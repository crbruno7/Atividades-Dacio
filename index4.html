<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Vendas | Infinity Bank</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a1a1a; text-align: center; margin-bottom: 20px; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        #resumo { margin-top: 20px; padding-top: 15px; border-top: 2px solid #eee; display: none; }
        .resumo-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95em; }
        .total { font-weight: bold; color: #28a745; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Infinity Bank</h2>
    
    <div class="field">
        <label>Valor da Venda (R$)</label>
        <input type="number" id="valorVenda" placeholder="Ex: 1000.00" step="0.01">
    </div>

    <div class="field">
        <label>Bandeira do Cartão</label>
        <select id="bandeira">
            <option value="0.02">Visa (2%)</option>
            <option value="0.0185">Mastercard (1.85%)</option>
            <option value="0.03">Elo (3%)</option>
        </select>
    </div>

    <div class="field">
        <label>Número de Parcelas</label>
        <input type="number" id="parcelas" min="1" max="12" value="1">
    </div>

    <button onclick="calcularSimulacao()">Simular Venda</button>

    <div id="resumo">
        <div class="resumo-item"><span>Taxa da Bandeira:</span> <span id="outTaxa"></span></div>
        <div class="resumo-item"><span>Juros Acumulados:</span> <span id="outJuros"></span></div>
        <div class="resumo-item"><span>Taxas Fixas Mensais:</span> <span id="outFixa"></span></div>
        <hr>
        <div class="resumo-item total"><span>Valor da Parcela:</span> <span id="outParcela"></span></div>
    </div>
</div>

<script>
    function calcularSimulacao() {
        // Entradas
        const valorOriginal = parseFloat(document.getElementById('valorVenda').value);
        const taxaBandeiraPerc = parseFloat(document.getElementById('bandeira').value);
        const qtdParcelas = parseInt(document.getElementById('parcelas').value);
        
        if (isNaN(valorOriginal) || valorOriginal <= 0) {
            alert("Por favor, insira um valor de venda válido.");
            return;
        }

        // 1. Cálculo da Taxa da Bandeira
        const valorTaxaBandeira = valorOriginal * taxaBandeiraPerc;

        // 2. Cálculo dos Juros Simples (0.35% ao mês)
        // J = C * i * t
        const jurosTotal = valorOriginal * 0.0035 * qtdParcelas;

        // 3. Taxa fixa mensal (12.50 por mês)
        const taxaFixaTotal = 12.50 * qtdParcelas;

        // 4. Valor Final e Parcela
        const valorTotalFinal = valorOriginal + valorTaxaBandeira + jurosTotal + taxaFixaTotal;
        const valorParcela = valorTotalFinal / qtdParcelas;

        // Exibição dos resultados
        document.getElementById('outTaxa').innerText = `R$ ${valorTaxaBandeira.toFixed(2)}`;
        document.getElementById('outJuros').innerText = `R$ ${jurosTotal.toFixed(2)}`;
        document.getElementById('outFixa').innerText = `R$ ${taxaFixaTotal.toFixed(2)}`;
        document.getElementById('outParcela').innerText = `R$ ${valorParcela.toFixed(2)}`;
        
        document.getElementById('resumo').style.display = 'block';
    }
</script>

</body>
</html>
